[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanslate"
version = "0.3.0"
description = "Cleanslate: paint over a watermark or object and erase it, with local (LaMa) or API inpainting. Gradio app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gradio>=5.0",
    "numpy",
    "pillow",
    "opencv-python-headless",
]

[project.optional-dependencies]
lama = ["torch"]
openai = ["openai>=1.40"]
all = ["torch", "openai>=1.40"]
dev = ["pytest"]

[project.scripts]
cleanslate = "cleanslate.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
