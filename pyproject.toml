[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wmremover"
version = "0.1.0"
description = "Gradio app to remove watermarks and objects from images with a Photoshop-style mask brush, using local or API inpainting models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gradio>=5.0",
    "numpy",
    "pillow",
    "opencv-python-headless",
]

[project.optional-dependencies]
lama = ["simple-lama-inpainting"]
openai = ["openai>=1.40"]
all = ["simple-lama-inpainting", "openai>=1.40"]
dev = ["pytest"]

[project.scripts]
wmremover = "wmremover.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
